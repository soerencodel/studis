<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latin Study</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--mute:#6f6f6f;--line:#e4e4e2;--soft:#f5f5f3;--ok:#1f7a3a;--okbg:#e9f5ec;--bad:#b3261e;--badbg:#fbecea}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ececec;--mute:#9a9a9a;--line:#2f2f2f;--soft:#202020;--ok:#72d08e;--okbg:#17301f;--bad:#ff8f86;--badbg:#3a1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:32px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.03em}
nav button{background:none;border:0;color:var(--mute);font:inherit;padding:4px 0 4px 16px;cursor:pointer}
nav button.on{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
h2{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:32px 0 10px}
p{margin:8px 0}
.mute{color:var(--mute)}.small{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.link{border:0;padding:2px 6px;color:var(--mute);background:none}
button.link:hover{color:var(--fg)}
input[type=text],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--mute)}
textarea{min-height:160px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.row{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.row>.lbl{width:92px;color:var(--mute);font-size:14px;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 12px;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=range]{width:220px}
.card{border:1px solid var(--line);border-radius:12px;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:16px}
.big{font-size:26px;font-weight:500;margin:4px 0 2px;word-break:break-word}
.sub{color:var(--mute)}
.ask{margin-top:14px;font-weight:600}
.answer{margin-top:20px}
.opts{display:grid;gap:8px;margin-top:20px}
.opts button{text-align:left;padding:10px 14px}
.opts button .k{color:var(--mute);margin-right:10px;font-size:13px}
.opts button.good{background:var(--okbg);border-color:var(--ok)}
.opts button.badpick{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:18px;padding:12px 14px;border-radius:8px}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.neutral{background:var(--soft)}
.fb b{color:var(--fg)}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.sels{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.sels select{width:auto;min-width:120px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
td.warn{color:var(--bad)}
tr.skip td{color:var(--mute)}
.score{font-size:40px;font-weight:600}
.miss{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kbd{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Latin</h1><nav id="nav"><button data-tab="quiz">Quiz</button><button data-tab="words">Words</button><button data-tab="data">Data</button></nav></header>
<main id="app"></main>
</div>

<script id="engine">
(function (G) {
'use strict';

/* ---------- text helpers ---------- */
const MACS = 'āēīōūȳĀĒĪŌŪȲ', PLAIN = 'aeiouyAEIOUY';
const MAC_RE = /[āēīōūȳĀĒĪŌŪȲ]/g;
function nfc(s) { return String(s == null ? '' : s).normalize('NFC').replace(/[̀-ͯ]/g, ''); }
function strip(s) { return nfc(s).replace(MAC_RE, c => PLAIN[MACS.indexOf(c)]); }
function lo(s) { return strip(s).toLowerCase(); }
function hasMac(s) { return /[āēīōūȳĀĒĪŌŪȲ]/.test(nfc(s)); }
function akey(s) { return lo(s).replace(/j/g, 'i').replace(/[^a-z]+/g, ' ').trim(); }
const pre = (p, arr) => arr.map(e => p + e);

/* ---------- endings ---------- */
const P6 = [[1, 'sg'], [2, 'sg'], [3, 'sg'], [1, 'pl'], [2, 'pl'], [3, 'pl']];
const BAM = ['bam', 'bās', 'bat', 'bāmus', 'bātis', 'bant'];
const BAR = ['bar', 'bāris', 'bātur', 'bāmur', 'bāminī', 'bantur'];
const BO = ['bō', 'bis', 'bit', 'bimus', 'bitis', 'bunt'];
const BOR = ['bor', 'beris', 'bitur', 'bimur', 'biminī', 'buntur'];
const AM = ['am', 'ēs', 'et', 'ēmus', 'ētis', 'ent'];
const AR = ['ar', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'];
const SA = ['am', 'ās', 'at', 'āmus', 'ātis', 'ant'];
const SAR = ['ar', 'āris', 'ātur', 'āmur', 'āminī', 'antur'];
const REM = ['rem', 'rēs', 'ret', 'rēmus', 'rētis', 'rent'];
const RER = ['rer', 'rēris', 'rētur', 'rēmur', 'rēminī', 'rentur'];
const SIM = ['im', 'īs', 'it', 'īmus', 'ītis', 'int'];
const LEM = ['lem', 'lēs', 'let', 'lēmus', 'lētis', 'lent'];
const PERF = ['ī', 'istī', 'it', 'imus', 'istis', 'ērunt'];
const PLUP = ['eram', 'erās', 'erat', 'erāmus', 'erātis', 'erant'];
const FUTP = ['erō', 'eris', 'erit', 'erimus', 'eritis', 'erint'];
const PSUBJ = ['erim', 'erīs', 'erit', 'erīmus', 'erītis', 'erint'];
const QSUBJ = ['issem', 'issēs', 'isset', 'issēmus', 'issētis', 'issent'];
const SUM = {
  pres: ['sum', 'es', 'est', 'sumus', 'estis', 'sunt'],
  impf: ['eram', 'erās', 'erat', 'erāmus', 'erātis', 'erant'],
  fut: ['erō', 'eris', 'erit', 'erimus', 'eritis', 'erunt'],
  psubj: ['sim', 'sīs', 'sit', 'sīmus', 'sītis', 'sint'],
  isubj: ['essem', 'essēs', 'esset', 'essēmus', 'essētis', 'essent'],
};

// Regular conjugations. Endings are added to the root (amō → am-).
const CJ = {
  1: { pa: ['ō', 'ās', 'at', 'āmus', 'ātis', 'ant'], pp: ['or', 'āris', 'ātur', 'āmur', 'āminī', 'antur'], iv: 'ā',
       fut: pre('ā', BO), futp: pre('ā', BOR), ps: ['em', 'ēs', 'et', 'ēmus', 'ētis', 'ent'], psp: ['er', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'],
       inf: 'āre', infp: 'ārī', imp: ['ā', 'āte'], impd: ['āre', 'āminī'], ppa: ['āns', 'antis'], gd: 'and' },
  2: { pa: ['eō', 'ēs', 'et', 'ēmus', 'ētis', 'ent'], pp: ['eor', 'ēris', 'ētur', 'ēmur', 'ēminī', 'entur'], iv: 'ē',
       fut: pre('ē', BO), futp: pre('ē', BOR), ps: pre('e', SA), psp: pre('e', SAR),
       inf: 'ēre', infp: 'ērī', imp: ['ē', 'ēte'], impd: ['ēre', 'ēminī'], ppa: ['ēns', 'entis'], gd: 'end' },
  3: { pa: ['ō', 'is', 'it', 'imus', 'itis', 'unt'], pp: ['or', 'eris', 'itur', 'imur', 'iminī', 'untur'], iv: 'ē',
       fut: AM, futp: AR, ps: SA, psp: SAR,
       inf: 'ere', infp: 'ī', imp: ['e', 'ite'], impd: ['ere', 'iminī'], ppa: ['ēns', 'entis'], gd: 'end' },
  '3io': { pa: ['iō', 'is', 'it', 'imus', 'itis', 'iunt'], pp: ['ior', 'eris', 'itur', 'imur', 'iminī', 'iuntur'], iv: 'iē',
       fut: pre('i', AM), futp: pre('i', AR), ps: pre('i', SA), psp: pre('i', SAR),
       inf: 'ere', infp: 'ī', imp: ['e', 'ite'], impd: ['ere', 'iminī'], ppa: ['iēns', 'ientis'], gd: 'iend' },
  4: { pa: ['iō', 'īs', 'it', 'īmus', 'ītis', 'iunt'], pp: ['ior', 'īris', 'ītur', 'īmur', 'īminī', 'iuntur'], iv: 'iē',
       fut: pre('i', AM), futp: pre('i', AR), ps: pre('i', SA), psp: pre('i', SAR),
       inf: 'īre', infp: 'īrī', imp: ['ī', 'īte'], impd: ['īre', 'īminī'], ppa: ['iēns', 'ientis'], gd: 'iend' },
};
const CONJ_CH = { 1: 1, 2: 1, 3: 8, '3io': 10, 4: 10 };

// Irregular verbs: present system written out; perfect system comes from the principal parts.
const IRR = {
  sum: { W: 4, pp3: 'fuī', pp4: 'futūrum', act: { pres: SUM.pres, impf: SUM.impf, fut: SUM.fut, psubj: SUM.psubj, isubj: SUM.isubj, imp: ['es', 'este'], inf: 'esse' } },
  possum: { W: 6, pp3: 'potuī', act: { pres: ['possum', 'potes', 'potest', 'possumus', 'potestis', 'possunt'], impf: pre('pot', SUM.impf), fut: pre('pot', SUM.fut), psubj: pre('pos', SUM.psubj), isubj: pre('poss', ['em', 'ēs', 'et', 'ēmus', 'ētis', 'ent']), inf: 'posse' } },
  eo: { W: 37, pp3: 'iī', pp4: 'itūrum', act: { pres: ['eō', 'īs', 'it', 'īmus', 'ītis', 'eunt'], impf: pre('ī', BAM), fut: pre('ī', BO), psubj: pre('e', SA), isubj: pre('ī', REM), imp: ['ī', 'īte'], inf: 'īre', ppa: ['iēns', 'euntis'], ger: 'eundī' } },
  fero: { W: 31, pp3: 'tulī', pp4: 'lātum',
    act: { pres: ['ferō', 'fers', 'fert', 'ferimus', 'fertis', 'ferunt'], impf: pre('ferē', BAM), fut: pre('fer', AM), psubj: pre('fer', SA), isubj: pre('fer', REM), imp: ['fer', 'ferte'], inf: 'ferre', ppa: ['ferēns', 'ferentis'], ger: 'ferendī', gdv: 'ferendus' },
    pass: { pres: ['feror', 'ferris', 'fertur', 'ferimur', 'feriminī', 'feruntur'], impf: pre('ferē', BAR), fut: pre('fer', AR), psubj: pre('fer', SAR), isubj: pre('fer', RER), inf: 'ferrī' } },
  volo: { W: 32, pp3: 'voluī', act: { pres: ['volō', 'vīs', 'vult', 'volumus', 'vultis', 'volunt'], impf: pre('volē', BAM), fut: pre('vol', AM), psubj: pre('vel', SIM), isubj: pre('vel', LEM), inf: 'velle', ppa: ['volēns', 'volentis'] } },
  nolo: { W: 32, pp3: 'nōluī', act: { pres: ['nōlō', 'nōn vīs', 'nōn vult', 'nōlumus', 'nōn vultis', 'nōlunt'], impf: pre('nōlē', BAM), fut: pre('nōl', AM), psubj: pre('nōl', SIM), isubj: pre('nōl', LEM), imp: ['nōlī', 'nōlīte'], inf: 'nōlle', ppa: ['nōlēns', 'nōlentis'] } },
  malo: { W: 32, pp3: 'māluī', act: { pres: ['mālō', 'māvīs', 'māvult', 'mālumus', 'māvultis', 'mālunt'], impf: pre('mālē', BAM), fut: pre('māl', AM), psubj: pre('māl', SIM), isubj: pre('māl', LEM), inf: 'mālle' } },
  fio: { W: 36, pp3: 'factus sum', act: { pres: ['fīō', 'fīs', 'fit', 'fīmus', 'fītis', 'fīunt'], impf: pre('fīē', BAM), fut: pre('fī', AM), psubj: pre('fī', SA), isubj: pre('fie', REM), inf: 'fierī' } },
};
const IRR_NAME = { sum: 'sum', possum: 'possum', eo: 'eō', fero: 'ferō', volo: 'volō', nolo: 'nōlō', malo: 'mālō', fio: 'fīō' };
const IRR_NOUNS = ['vis', 'domus', 'deus', 'iuppiter', 'bos'];
const UNUS_NAUTA = ['unus', 'ullus', 'nullus', 'solus', 'neuter', 'alius', 'alter', 'uter', 'totus'];

/* ---------- import parsing ---------- */
function splitLine(line) {
  const m = line.match(/\s*(?:—|–|--|\t|\s-\s|\s=\s)\s*/);
  if (!m) return null;
  return [line.slice(0, m.index).trim(), line.slice(m.index + m[0].length).trim()];
}

function parseGender(tl) {
  const m = tl.match(/^(m|f|n|c)\.?(?:\s*(?:\/|or|&|and)\s*(m|f|n)\.?)?(\s*pl\.?)?$/);
  if (!m) return null;
  let g = m[1];
  if (m[2]) g = (g === 'n' || m[2] === 'n') ? 'n' : 'mf';
  if (g === 'c') g = 'mf';
  return { g, pl: !!m[3] };
}

const POS_RE = /^(adj|adv|prep|conj|interj|indecl|pron|num|interrog|enclitic)\.?(\s|$)/;
function tokenize(latin) {
  let s = latin, iStem = false, gender = null, plural = false, gen1 = null, pos = null;
  if (/\(\s*i\s*\)/i.test(s)) { iStem = true; s = s.replace(/\(\s*i\s*\)/ig, ' '); }
  s = s.replace(/\([^)]*\)/g, ' ').replace(/\[[^\]]*\]/g, ' ');
  const toks = [];
  for (let t of s.split(',')) {
    t = t.replace(/\s*\+.*$/, '').trim();
    if (!t) continue;
    const tl = lo(t);
    const g = parseGender(tl);
    if (g) { gender = g.g; if (g.pl) plural = true; continue; }
    if (/^pl\.?$/.test(tl)) { plural = true; continue; }
    const pm = tl.match(POS_RE);
    if (pm) { pos = pos || pm[1]; continue; }
    let m = t.match(/^gen\.?\s*(.+)$/i);
    if (m) { gen1 = m[1].trim(); continue; }
    m = t.match(/^(.*\S)\s+((?:m|f|n|c)\.(?:\s*\/\s*(?:m|f|n)\.)?(?:\s*pl\.?)?)$/i);
    if (m) { const g2 = parseGender(lo(m[2])); if (g2) { gender = g2.g; if (g2.pl) plural = true; t = m[1]; } }
    toks.push(t);
  }
  return { toks, iStem, gender, plural, gen1, pos };
}

// Expand an abbreviated ending ("-ae") against the headword ("puella").
function expand(base, ab) {
  const b = lo(base), a = lo(ab);
  const start = Math.max(0, b.length - 4);
  for (let k = Math.min(3, a.length); k >= 1; k--) {
    const i = b.lastIndexOf(a.slice(0, k));
    if (i >= start && i > 0) return base.slice(0, i) + ab;
  }
  if (/er$/.test(b)) return base + ab;
  const m = b.match(/(us|um|is|es|os|a|e)$/);
  if (m) return base.slice(0, b.length - m[1].length) + ab;
  return null;
}
// Verbs: "amō, -āre, -āvī, -ātum" → root am-
function vexpand(base, ab) {
  const m = lo(base).match(/(eo|io|o|eor|ior|or)$/);
  if (!m) return null;
  return base.slice(0, base.length - m[1].length) + ab;
}

function syll(s) {
  const x = lo(s).replace(/qu/g, 'q').replace(/^i(?=[aeiou])/, 'j').replace(/(ae|au|oe|eu)/g, 'a');
  return (x.match(/[aeiouy]/g) || []).length;
}
function isIStem(nom, gen, gender) {
  const n = lo(nom), g = lo(gen), stem = g.slice(0, -2);
  if (gender === 'n') return /(e|al|ar)$/.test(n);
  if (/(is|es)$/.test(n) && syll(n) === syll(g)) return true;
  if (syll(n) === 1 && /[sx]$/.test(n) && /[^aeiouy]{2}$/.test(stem)) return true;
  return false;
}

const ORD = { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th', 5: '5th' };
const GLAB = { m: 'm.', f: 'f.', n: 'n.', mf: 'm./f.' };
const POS_NAME = { adv: 'adverb', prep: 'preposition', conj: 'conjunction', interj: 'interjection', pron: 'pronoun', num: 'numeral', indecl: 'indeclinable', interrog: 'interrogative', enclitic: 'enclitic', adj: 'adjective' };

function parseLine(raw) {
  const line = nfc(raw).replace(/[^\S\t]+/g, ' ').trim();
  if (!line || line.startsWith('#')) return null;
  const sp = splitLine(line);
  if (!sp || !sp[0] || !sp[1]) return { line, error: 'No “—” between the Latin and the English.' };
  const w = { line, latin: sp[0], english: sp[1], lemma: '', type: 'other', label: 'vocab only', warn: null, mac: hasMac(sp[0]) };
  classify(w);
  return w;
}

function classify(w) {
  const T = tokenize(w.latin);
  let t = T.toks;
  if (!t.length) { w.warn = 'Could not read the Latin.'; return; }
  w.lemma = t[0];
  if (T.pos && T.pos !== 'adj') { w.label = (POS_NAME[T.pos] || T.pos) + ' (vocab only)'; return; }
  const l0 = lo(t[0]);
  const l1raw = t[1] ? lo(t[1]).replace(/^-/, '') : '';
  const verbish = t.length >= 2 && /(o|or)$/.test(l0) && /(re|ri|i)$/.test(l1raw);
  t = t.map((x, i) => (i && x.startsWith('-')) ? (verbish ? vexpand(t[0], x.slice(1)) : expand(t[0], x.slice(1))) : x);
  if (t.some(x => x == null)) { w.warn = 'Could not expand an abbreviated ending. Write the form out in full.'; return; }
  const L = t.map(lo);

  // defective verbs (ōdī, meminī)
  if (t.length >= 2 && /i$/.test(L[0]) && /isse$/.test(L[1])) { w.label = 'defective verb (vocab only)'; w.warn = 'Defective verb, so it is quizzed as vocab only.'; return; }

  // irregular verbs
  const irr = detectIrr(t, L);
  if (irr) {
    const I = IRR[irr.irr];
    const v = { irr: irr.irr, prefix: irr.prefix, conj: 3 };
    const pp3 = t[2] || (irr.prefix + I.pp3);
    const pp4 = t[3] || (I.pp4 ? irr.prefix + I.pp4 : null);
    if (irr.irr === 'fio') { v.ppp = pp3.split(' ')[0].slice(0, -2); }
    else {
      if (/i$/.test(lo(pp3))) v.perf = pp3.slice(0, -1);
      const pi = pp4 && ppInfo(pp4);
      if (pi) { v.fap = pi.fap; if (pi.ppp && I.pass) { v.ppp = pi.ppp; v.pass = true; } }
    }
    w.type = 'verb'; w.v = v;
    w.label = 'irregular verb (' + (irr.prefix ? 'compound of ' : '') + IRR_NAME[irr.irr] + ')';
    return;
  }

  // regular verbs
  if (t.length >= 2 && /(o|or)$/.test(L[0]) && /(are|ere|ire|ari|eri|iri|i)$/.test(L[1]) && !/is$/.test(L[1])) {
    const dep = /or$/.test(L[0]);
    let conj = null;
    if (!dep) {
      if (/are$/.test(L[1])) conj = 1;
      else if (/eo$/.test(L[0]) && /ere$/.test(L[1])) conj = 2;
      else if (/io$/.test(L[0]) && /ire$/.test(L[1])) conj = 4;
      else if (/io$/.test(L[0]) && /ere$/.test(L[1])) conj = '3io';
      else if (/ere$/.test(L[1])) conj = 3;
    } else {
      if (/ari$/.test(L[1]) && !/(eor|ior)$/.test(L[0])) conj = 1;
      else if (/eor$/.test(L[0]) && /eri$/.test(L[1])) conj = 2;
      else if (/ior$/.test(L[0]) && /iri$/.test(L[1])) conj = 4;
      else if (/ior$/.test(L[0]) && /i$/.test(L[1])) conj = '3io';
      else if (/i$/.test(L[1])) conj = 3;
    }
    if (conj) {
      const cut = (dep && (conj === 3 || conj === '3io')) ? 1 : 3;
      const v = { conj, dep, root: t[1].slice(0, -cut) };
      const warns = [];
      if (dep) {
        if (t[2] && /us sum$/.test(L[2])) { v.ppp = t[2].split(' ')[0].slice(0, -2); v.fap = v.ppp; }
        else warns.push('Missing the perfect (e.g. “hortātus sum”), so perfect forms are skipped.');
      } else if (t[2] && /us sum$/.test(L[2])) {
        v.semi = true; v.ppp = t[2].split(' ')[0].slice(0, -2); v.fap = v.ppp;
      } else {
        if (t[2] && /i$/.test(L[2])) v.perf = t[2].slice(0, -1);
        else warns.push('No perfect stem given, so perfect active forms are skipped.');
        const pi = t[3] && ppInfo(t[3]);
        if (pi) { v.fap = pi.fap; if (pi.ppp) { v.ppp = pi.ppp; v.pass = true; } }
      }
      if ((conj === 3 && (/duco$/.test(L[0]) || L[0] === 'dico')) || L[0] === 'facio') v.shortImp = true;
      w.type = 'verb'; w.v = v;
      const cn = conj === '3io' ? '3rd conj. -iō' : ORD[conj] + ' conj.';
      w.label = cn + ' verb' + (dep ? ' (deponent)' : v.semi ? ' (semi-deponent)' : (!v.pass ? ', no passive' : ''));
      if (warns.length) w.warn = warns.join(' ');
      return;
    }
  }

  // adjectives
  if (T.gen1 && t.length === 1) {
    const gen = T.gen1.startsWith('-') ? expand(t[0], T.gen1.slice(1)) : T.gen1;
    if (gen && /is$/.test(lo(gen))) {

      let cls = '';
      if (answered) { if (o.ok) cls = 'good'; else if (q.pickI === i) cls = 'badpick'; }
      return `<button data-act="pick" data-i="${i}" class="${cls}" ${answered ? 'disabled' : ''}><span class="k">${i + 1}</span>${esc(o.text)}</button>`;
    }).join('')}</div>`;
  }
  let fb = '', acts = '';
  if (q.state === 'ask') {
    if (q.ui === 'typed' || q.ui === 'parse') acts = `<button class="primary" data-act="submit">Check</button><span class="kbd">Enter</span>`;
    if (q.ui === 'self') acts = `<button class="primary" data-act="submit">Show answer</button><span class="kbd">Enter</span>`;
    if (q.ui === 'mc') acts = `<span class="kbd">Press 1–4</span>`;
  } else if (q.state === 'self') {
    fb = `<div class="fb neutral">Expected: <b>${esc(q.answer)}</b></div>`;
    acts = `<button data-act="self" data-ok="1">✓ I was right</button><button data-act="self" data-ok="0">✗ I was wrong</button><span class="kbd">Y / N</span>`;
  } else {
    fb = q.ok ? `<div class="fb good">✓ Correct${q.ui !== 'self' ? ` · <b>${esc(q.answer)}</b>` : ''}</div>`
              : `<div class="fb bad">✗ ${q.ui === 'self' ? 'Marked wrong' : 'Answer'}: <b>${esc(q.answer)}</b></div>`;
    acts = `<button class="primary" data-act="next">${Q.i + 1 < Q.qs.length ? 'Next' : 'Finish'}</button><span class="kbd">Enter</span>`;
    if (!q.ok && q.canOverride && q.ui === 'typed') acts += `<button class="link" data-act="override">I was right</button>`;
  }
  $app.innerHTML = `<div class="top"><span>${Q.i + 1} / ${Q.qs.length}</span><button class="link" data-act="quit">End quiz</button></div>
    <div class="card">${q.html}${body}${fb}<div class="actions">${acts}</div></div>`;
  const inp = document.getElementById('ans');
  if (inp && q.state === 'ask') inp.focus();
  else if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  if (q.ui === 'parse' && q.state === 'ask') { const s = document.querySelector('#sels select'); if (s && !Object.keys(q.sel).length) s.focus(); }
}

function submit() {
  const q = view.quiz.qs[view.quiz.i];
  if (q.state !== 'ask') return;
  if (q.ui === 'typed') {
    const v = document.getElementById('ans').value.trim();
    if (!v) return;
    q.given = v; q.ok = q.check(v); q.state = 'done'; record(q.wid, q.k, q.ok);
  } else if (q.ui === 'self') {
    q.given = document.getElementById('ans').value.trim(); q.state = 'self';
  } else if (q.ui === 'parse') {
    const k = parseSelKey(q);
    if (!k) { const s = [...document.querySelectorAll('#sels select')].find(x => !x.value); if (s) s.focus(); return; }
    q.ok = q.vkeys.has(k); q.state = 'done'; record(q.wid, q.k, q.ok);
  }
  renderQuestion();
}
function pickOpt(i) {
  const q = view.quiz.qs[view.quiz.i];
  if (q.state !== 'ask' || !q.options[i]) return;
  q.pickI = i; q.ok = q.options[i].ok; q.state = 'done'; record(q.wid, q.k, q.ok);
  renderQuestion();
}
function selfGrade(ok) {
  const q = view.quiz.qs[view.quiz.i];
  if (q.state !== 'self') return;
  q.ok = ok; q.state = 'done'; record(q.wid, q.k, ok);
  next();
}
function next() {
  const Q = view.quiz;
  if (Q.i + 1 < Q.qs.length) { Q.i++; renderQuestion(); }
  else { Q.done = true; renderResults(); }
}

/* ---------- results ---------- */
function renderResults() {
  const Q = view.quiz, asked = Q.qs.filter(q => q.state === 'done');
  const right = asked.filter(q => q.ok).length, miss = asked.filter(q => !q.ok);
  $app.innerHTML = `<div class="score">${right} / ${asked.length}</div>
    <p class="mute">${asked.length ? Math.round(100 * right / asked.length) + '% correct' : 'No questions answered.'}</p>
    <div class="actions">${miss.length ? '<button class="primary" data-act="retry">Retry misses</button>' : ''}<button data-act="newquiz">New quiz</button></div>
    ${miss.length ? '<h2>Missed</h2>' + miss.map(q => `<div class="miss">${esc(q.plain)}<br><span class="mute">→ ${esc(q.answer)}</span>${q.given ? `<br><span class="mute small">you: ${esc(q.given)}</span>` : ''}</div>`).join('') : ''}`;
}

/* ---------- words ---------- */
const EXAMPLE = `amō, amāre, amāvī, amātum — to love, like
moneō, -ēre, -uī, -itum — to remind, warn
puella, -ae, f. — girl
rēx, rēgis, m. — king
magnus, -a, -um — large, great
fortis, forte — strong, brave
potēns, gen. potentis — powerful
hortor, hortārī, hortātus sum — to encourage, urge
semper, adv. — always`;
function renderWords() {
  const pv = view.preview;
  let html = `<h2 style="margin-top:0">Import</h2>
    <p class="mute small">One word per line, in the form <b>Latin — English</b>. You can use –, --, a tab or “ - ” instead of —. Add <b>(i)</b> to force a 3rd-declension i-stem.</p>
    <textarea id="imp" placeholder="${esc(EXAMPLE)}">${esc(view.importText || '')}</textarea>
    <div class="actions"><button class="primary" data-act="preview">Preview</button></div>`;
  if (pv) {
    const add = pv.filter(r => r.status === 'new').length;
    html += `<h2>Preview</h2><table><tr><th>Latin</th><th>English</th><th>Detected</th></tr>${pv.map(r => {
      if (r.status === 'error') return `<tr><td colspan="2">${esc(r.r.line)}</td><td class="warn">${esc(r.r.error)}</td></tr>`;
      const note = r.status === 'dup' ? `<br><span class="mute">${r.why}, so it will be skipped</span>` : (r.r.warn ? `<br><span class="warn" style="color:var(--bad)">${esc(r.r.warn)}</span>` : '');
      return `<tr class="${r.status === 'dup' ? 'skip' : ''}"><td>${esc(r.r.latin)}</td><td>${esc(r.r.english)}</td><td>${esc(r.r.label)}${note}</td></tr>`;
    }).join('')}</table>
    <div class="actions"><button class="primary" data-act="save" ${add ? '' : 'disabled'}>Add ${add} word${add === 1 ? '' : 's'}</button><button data-act="cancelpv">Cancel</button></div>`;
  }
  const q = E.lo(view.search || '');
  const list = WORDS.filter(w => !q || E.lo(w.latin + ' ' + w.english).includes(q));
  html += `<h2>Your words (${WORDS.length})</h2>`;
  if (WORDS.length) {
    html += `<input type="text" id="search" placeholder="Search" value="${esc(view.search || '')}">
      <table style="margin-top:8px"><tr><th>Latin</th><th>English</th><th>Type</th><th title="vocab / forms accuracy">V · F</th><th></th></tr>
      ${list.map(w => `<tr><td>${esc(w.latin)}</td><td>${esc(w.english)}</td><td class="mute">${esc(w.label)}${w.warn ? `<br><span style="color:var(--bad)">${esc(w.warn)}</span>` : ''}</td>
        <td class="mute" style="white-space:nowrap">${pct(w.id, 'v')} · ${pct(w.id, 'f')}</td>
        <td style="white-space:nowrap"><button class="link" data-act="edit" data-id="${w.id}" title="Edit">✎</button><button class="link" data-act="del" data-id="${w.id}" title="Delete">✕</button></td></tr>`).join('')}</table>`;
  } else html += '<p class="mute">None yet.</p>';
  $app.innerHTML = html;
}
function doPreview() {
  view.importText = document.getElementById('imp').value;
  const dupKey = w => E.akey(w.lemma) + '|' + w.label;
  const bank = new Set(WORDS.map(dupKey)), seen = new Set();
  view.preview = view.importText.split(/\r?\n/).map(l => E.parseLine(l)).filter(Boolean).map(r => {
    if (r.error) return { r, status: 'error' };
    const k = dupKey(r);
    if (bank.has(k)) return { r, status: 'dup', why: 'already in your words' };
    if (seen.has(k)) return { r, status: 'dup', why: 'listed twice in this paste' };
    seen.add(k); return { r, status: 'new' };
  });
  renderWords();
}
function doSave() {
  view.preview.filter(r => r.status === 'new').forEach(r => D.words.push({ id: uid(), line: r.r.line }));
  save(); reparse(); view.preview = null; view.importText = ''; renderWords();
}

/* ---------- data ---------- */
function renderData() {
  $app.innerHTML = `<p class="mute">Your words and stats are saved in this browser only. Export a backup now and then.</p>
    <div class="actions"><button data-act="export">Export backup (.json)</button><button data-act="restore">Restore from backup…</button>
    <input type="file" id="file" accept=".json,application/json" hidden></div>
    <h2>Reset</h2>
    <div class="actions"><button data-act="resetstats">Reset stats</button><button data-act="delall">Delete all words</button></div>
    <p class="mute small" style="margin-top:32px">${WORDS.length} words.</p>`;
}
function doExport() {
  const blob = new Blob([JSON.stringify({ app: 'latin-study', v: 1, words: D.words, stats: D.stats, cfg: D.cfg }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'latin-study-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function doRestore(file) {
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { alert('That file is not valid JSON.'); return; }
    if (!d || !Array.isArray(d.words) || d.words.some(x => !x || typeof x.line !== 'string')) { alert('That file is not a Latin Study backup.'); return; }
    if (!confirm(`Replace your current ${WORDS.length} words and stats with ${d.words.length} words from the backup?`)) return;
    D.words = d.words.map(x => ({ id: String(x.id || uid()), line: x.line }));
    D.stats = d.stats && typeof d.stats === 'object' ? d.stats : {};
    if (d.cfg) D.cfg = Object.assign({}, DEFAULT_CFG, d.cfg);
    save(); reparse(); view.quiz = null; render();
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, c = D.cfg;
  switch (a) {
    case 'cfg': { const k = b.dataset.k; let v = b.dataset.v; if (k === 'count' && v !== 'all') v = +v; c[k] = v; save(); renderSetup(); break; }
    case 'start': startQuiz(); break;
    case 'submit': submit(); break;
    case 'pick': pickOpt(+b.dataset.i); break;
    case 'self': selfGrade(b.dataset.ok === '1'); break;
    case 'next': next(); break;
    case 'override': { const q = view.quiz.qs[view.quiz.i]; if (!q.ok) { q.ok = true; flip(q.wid, q.k); renderQuestion(); } break; }
    case 'quit': view.quiz.done = true; renderResults(); break;
    case 'retry': retryMisses(); break;
    case 'newquiz': view.quiz = null; renderSetup(); break;
    case 'preview': doPreview(); break;
    case 'save': doSave(); break;
    case 'cancelpv': view.preview = null; renderWords(); break;
    case 'del': {
      const w = WORDS.find(x => x.id === b.dataset.id);
      if (w && confirm(`Delete “${w.latin}”?`)) { D.words = D.words.filter(x => x.id !== w.id); delete D.stats[w.id]; save(); reparse(); renderWords(); }
      break;
    }
    case 'edit': {
      const x = D.words.find(y => y.id === b.dataset.id); if (!x) break;
      const s = prompt('Edit entry (Latin — English):', x.line);
      if (s == null) break;
      const r = E.parseLine(s);
      if (!r || r.error) { alert(r ? r.error : 'Empty entry.'); break; }
      x.line = r.line; save(); reparse(); renderWords();
      break;
    }
    case 'export': doExport(); break;
    case 'restore': document.getElementById('file').click(); break;
    case 'resetstats': if (confirm('Reset all right/wrong stats?')) { D.stats = {}; save(); renderData(); } break;
    case 'delall': if (confirm(`Delete all ${WORDS.length} words and their stats? Export a backup first if you want to keep them.`)) { D.words = []; D.stats = {}; save(); reparse(); view.quiz = null; renderData(); } break;
  }
});
$app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'ch') { D.cfg.ch = +t.value; document.getElementById('chv').textContent = t.value; }
  if (t.id === 'search') { view.search = t.value; const pos = t.selectionStart; renderWords(); const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos); }
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'ch') { save(); renderSetup(); }
  if (t.dataset.act === 'cat') { D.cfg.cats[t.dataset.k] = t.checked; save(); renderSetup(); }
  if (t.dataset.act === 'voice') { D.cfg.voice[t.dataset.k] = t.checked; save(); renderSetup(); }
  if (t.id === 'file' && t.files[0]) doRestore(t.files[0]);
  if (t.dataset.sel) {
    const q = view.quiz.qs[view.quiz.i];
    q.sel[t.dataset.sel] = t.value;
    if (t.dataset.sel === 'm') {
      for (const k of Object.keys(q.sel)) if (k !== 'm' && !parseFields(q).some(f => f[0] === k)) delete q.sel[k];
      renderQuestion();
      const s = [...document.querySelectorAll('#sels select')].find(x => !x.value); if (s) s.focus();
    }
  }
});
document.addEventListener('keydown', e => {
  if (view.tab !== 'quiz' || !view.quiz || view.quiz.done) return;
  const q = view.quiz.qs[view.quiz.i];
  if (e.key === 'Enter') {
    e.preventDefault();
    if (q.state === 'done') next();
    else if (q.state === 'ask' && q.ui !== 'mc') submit();
    return;
  }
  if (q.state === 'ask' && q.ui === 'mc' && /^[1-4]$/.test(e.key)) { pickOpt(+e.key - 1); return; }
  if (q.state === 'self' && /^[yn]$/i.test(e.key)) { e.preventDefault(); selfGrade(e.key.toLowerCase() === 'y'); }
});

render();
})();
</script>
</body>
</html>
